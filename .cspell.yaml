version: "0.2"
language: en-US

dictionaries:
  - softwareTerms
  - python
  - bash
  - docker
  - companies
  - fullstack
  - filetypes

ignorePaths:
  - .gitignore
  - LICENSE
  - test/csv/**
  - test/json/**
  - test/pcap/**
  - test/rec/**

# Protocol constants and environment variables (PROT_CMD_JUPMNGR_..., STATEDIR,
# struct formats such as HHLH) are written in ALL CAPS.
patterns:
  - name: AllCaps
    pattern: /\b[A-Z][A-Z0-9_]{3,}\b/g

ignoreRegExpList:
  - AllCaps

