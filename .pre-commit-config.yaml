# Setup, or refresh the venv and hook cache: ./setup-dev.sh
# Run on everything: .venv/bin/pre-commit run --all-files

# Never touch: golden test data and the verbatim GPLv3 text.
exclude: ^(LICENSE$|test/(csv|json|pcap|rec)/)

repos:
  - repo: local
    hooks:
      - id: check-added-large-files
        name: check for added large files
        language: python
        additional_dependencies: [pre-commit-hooks]
        entry: check-added-large-files
      - id: check-executables-have-shebangs
        name: check that executables have shebangs
        language: python
        additional_dependencies: [pre-commit-hooks]
        entry: check-executables-have-shebangs
        types: [text, executable]
      - id: check-merge-conflict
        name: check for merge conflicts
        language: python
        additional_dependencies: [pre-commit-hooks]
        entry: check-merge-conflict
        types: [text]
      - id: check-shebang-scripts-are-executable
        name: check that scripts with shebangs are executable
        language: python
        additional_dependencies: [pre-commit-hooks]
        entry: check-shebang-scripts-are-executable
        types: [text]
      - id: end-of-file-fixer
        name: fix end of files
        language: python
        additional_dependencies: [pre-commit-hooks]
        entry: end-of-file-fixer
        types: [text]
      - id: mixed-line-ending
        name: mixed line ending
        language: python
        additional_dependencies: [pre-commit-hooks]
        entry: mixed-line-ending --fix=no
        types: [text]
      - id: trailing-whitespace
        name: trim trailing whitespace
        language: python
        additional_dependencies: [pre-commit-hooks]
        entry: trailing-whitespace-fixer
        types: [text]

      - id: markdownlint-cli2
        name: markdownlint
        language: node
        additional_dependencies: [markdownlint-cli2]
        entry: markdownlint-cli2 --fix
        types: [markdown]

      - id: cspell
        name: cspell
        language: node
        additional_dependencies: [cspell]
        entry: cspell lint --no-progress --no-summary --no-must-find-files
        types: [text]

      - id: codespell
        name: codespell
        language: python
        additional_dependencies: [codespell, tomli]
        entry: codespell
        types: [text]

      - id: codespell-fix
        name: codespell (interactive fix)
        stages: [manual]
        language: python
        additional_dependencies: [codespell, tomli]
        entry: sh -c 'exec codespell --write-changes --interactive 3 "$@" < /dev/tty > /dev/tty 2>&1' --
        require_serial: true
        types: [text]

      - id: shellcheck
        name: shellcheck
        language: python
        additional_dependencies: [shellcheck-py]
        entry: shellcheck
        types: [shell]

      - id: hadolint
        name: hadolint
        language: python
        additional_dependencies: [hadolint-py]
        entry: hadolint
        # Dockerfile and Containerfile are symlinks to Containerfile.alpine.
        files: ^Containerfile\.
